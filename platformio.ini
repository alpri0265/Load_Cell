[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328new
; board=...new -> швидкість заливки 115200 бод (сучасний бутлоадер Optiboot).
; Якщо знову з'явиться "avrdude: stk500_recv(): programmer is not responding" -
; замініть на board = nanoatmega328 (стара версія, 57600 бод, старий ATmegaBOOT).
upload_port = COM6
framework = arduino
monitor_speed = 115200
monitor_port = COM6

lib_deps =
    bogde/HX711 @ ^0.7.5
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
